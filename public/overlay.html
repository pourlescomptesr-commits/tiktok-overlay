<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xortex Stream Overlay — TikTok Auction Live</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Outfit:wght@700;800;900&family=Share+Tech+Mono&family=Teko:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100vw; height: 100vh;
  background: transparent;
  display: flex; justify-content: center; align-items: center;
  overflow: hidden;
  font-family: 'Outfit', sans-serif; color: #fff;
}

/* BASE STACKED OVERLAY CONTAINER */
.stacked-overlay {
  display: flex; flex-direction: column; gap: 10px;
  width: 340px; position: relative; z-index: 10;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* STYLE 1: XORTEX HYPE CARDS */
body.theme-xortex_hype .pill-card {
  background: rgba(7, 6, 20, 0.95); border-radius: 14px; padding: 11px 18px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 0.85rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}
body.theme-xortex_hype .pill-card.min { border: 2px solid #00e676; color: #00e676; box-shadow: 0 0 15px rgba(0,230,118,0.25); }
body.theme-xortex_hype .pill-card.snipe { border: 2px solid #ff3b5c; color: #fff; box-shadow: 0 0 15px rgba(255,59,92,0.35); }
body.theme-xortex_hype .pill-card.snipe .val { background: #ff3b5c; padding: 3px 10px; border-radius: 8px; color: #fff; font-weight: 900; }
body.theme-xortex_hype .pill-card.vouch { border: 2px solid #ffd700; color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.3); }
body.theme-xortex_hype .main-box {
  background: rgba(7, 6, 20, 0.96); border: 2.5px solid var(--accent, #00f3ff); border-radius: 22px;
  padding: 22px 18px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
  box-shadow: 0 0 40px rgba(0, 243, 255, 0.35); position: relative; overflow: hidden;
}
body.theme-xortex_hype .timer-num {
  font-family: 'Orbitron', sans-serif; font-size: 3.6rem; font-weight: 900;
  color: #39ff14; text-shadow: 0 0 25px rgba(57, 255, 20, 0.75), 0 0 50px rgba(57,255,20,0.4);
  line-height: 1; letter-spacing: 2px;
}

/* STYLE 2: CYBER ARCADE RECTANGULAR HUD */
body.theme-cyber_arcade .stacked-overlay { width: 360px; gap: 6px; }
body.theme-cyber_arcade .pill-card {
  background: rgba(4, 18, 30, 0.96); border-radius: 0px; padding: 10px 16px;
  border-left: 4px solid var(--accent, #00f3ff); border-right: 1px solid rgba(0, 243, 255, 0.35);
  font-family: 'Share Tech Mono', monospace; font-size: 0.88rem; font-weight: 700; text-transform: uppercase;
}
body.theme-cyber_arcade .pill-card.snipe .val { background: #ff3b5c; color: #fff; padding: 2px 8px; border-radius: 0; }
body.theme-cyber_arcade .main-box {
  background: rgba(2, 10, 20, 0.98); border: 2px solid var(--accent, #00f3ff); border-radius: 0px;
  padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px;
  box-shadow: inset 0 0 30px rgba(0, 243, 255, 0.2), 0 0 35px rgba(0, 243, 255, 0.45);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
}
body.theme-cyber_arcade .timer-num {
  font-family: 'Share Tech Mono', monospace; font-size: 3.8rem; font-weight: 700;
  color: var(--accent, #00f3ff); text-shadow: 0 0 25px var(--accent, #00f3ff); line-height: 1;
}

/* STYLE 3: GALAXY NEBULA ORBIT */
body.theme-galaxy_nebula .stacked-overlay { width: 340px; gap: 12px; }
body.theme-galaxy_nebula .pill-card {
  background: rgba(13, 11, 38, 0.95); border-radius: 30px; padding: 10px 20px;
  border: 1.5px solid rgba(176, 38, 255, 0.45); color: #ce93d8; font-size: 0.82rem; font-weight: 900;
}
body.theme-galaxy_nebula .pill-card.snipe .val { background: #b026ff; color: #fff; padding: 3px 10px; border-radius: 20px; }
body.theme-galaxy_nebula .main-box {
  background: radial-gradient(circle at 50% 30%, rgba(107, 17, 255, 0.45) 0%, rgba(7, 6, 20, 0.98) 70%);
  border: 2px solid #b026ff; border-radius: 28px; padding: 24px 20px;
  box-shadow: 0 0 50px rgba(176, 38, 255, 0.45), inset 0 0 25px rgba(107, 17, 255, 0.3);
}
body.theme-galaxy_nebula .timer-num {
  font-family: 'Teko', sans-serif; font-size: 4.6rem; font-weight: 700;
  color: #fff; text-shadow: 0 0 30px #b026ff, 0 0 60px #6b11ff; line-height: 0.9;
}

/* STYLE 4: ESPORTS TOURNAMENT PRO */
body.theme-esports_pro .stacked-overlay { width: 350px; gap: 8px; }
body.theme-esports_pro .pill-card {
  background: linear-gradient(135deg, rgba(20, 20, 25, 0.98), rgba(5, 5, 10, 0.98));
  border-left: 4px solid #ffd700; border-radius: 6px; padding: 10px 18px;
  font-size: 0.82rem; font-weight: 900; color: #ffd700; text-transform: uppercase;
  box-shadow: 0 6px 20px rgba(0,0,0,0.7);
}
body.theme-esports_pro .pill-card.snipe { border-left-color: #ff3b5c; color: #fff; }
body.theme-esports_pro .pill-card.snipe .val { background: #ff3b5c; color: #fff; padding: 3px 8px; border-radius: 4px; }
body.theme-esports_pro .main-box {
  background: rgba(10, 10, 15, 0.98); border: 2px solid #ffd700; border-radius: 12px;
  padding: 22px; box-shadow: 0 0 35px rgba(255, 215, 0, 0.35);
}
body.theme-esports_pro .timer-num {
  font-family: 'Outfit', sans-serif; font-size: 3.6rem; font-weight: 900;
  color: #ffd700; text-shadow: 0 0 25px rgba(255, 215, 0, 0.8); line-height: 1;
}

/* STYLE 5: SYNTHWAVE NEON RETRO */
body.theme-neon_synthwave .pill-card {
  background: #000; border-radius: 12px; padding: 10px 16px;
  border: 2px solid #ff007f; color: #ff007f; box-shadow: 0 0 15px #ff007f;
  font-size: 0.82rem; font-weight: 900;
}
body.theme-neon_synthwave .main-box {
  background: #050508; border: 3px solid #00f3ff; border-radius: 20px; padding: 22px;
  box-shadow: 0 0 25px #00f3ff, inset 0 0 15px #ff007f;
}
body.theme-neon_synthwave .timer-num {
  font-family: 'Orbitron', sans-serif; font-size: 3.6rem; font-weight: 900;
  color: #ff007f; text-shadow: 0 0 25px #ff007f, 0 0 50px #00f3ff; line-height: 1;
}

/* GENERAL STYLES & MEDALS */
.timer-num.warn { color: #ffaa00 !important; text-shadow: 0 0 25px #ffaa00 !important; }
.timer-num.snipe { color: #ff3b5c !important; text-shadow: 0 0 30px #ff3b5c !important; animation: blink 0.8s ease infinite alternate; }
@keyframes blink { from { opacity: 1; } to { opacity: 0.35; } }

.sep { width: 100%; height: 1.5px; background: linear-gradient(90deg, transparent, var(--accent, #00f3ff), transparent); margin: -2px 0 2px 0; }

.ranks { width: 100%; display: flex; flex-direction: column; gap: 9px; }
.rrow {
  background: rgba(255, 255, 255, 0.04);
  border: 1.5px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px; padding: 8px 12px;
  display: flex; align-items: center; gap: 10px; height: 52px;
}
.rrow.r1 { border-color: var(--accent, #00f3ff); background: rgba(0, 243, 255, 0.08); box-shadow: 0 0 15px rgba(0, 243, 255, 0.25); }
.rrow.r2 { border-color: rgba(180, 180, 190, 0.4); }
.rrow.r3 { border-color: rgba(205, 127, 50, 0.4); }

.medal { font-size: 1.25rem; }
.rav-wrap { position: relative; width: 36px; height: 36px; }
.rav { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(255,255,255,0.25); background: rgba(0,0,0,0.4); }
.rbadge {
  position: absolute; bottom: -3px; right: -3px;
  width: 16px; height: 16px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; font-weight: 900; background: #fff; color: #000;
}
.r1 .rbadge { background: var(--accent, #00f3ff); } .r2 .rbadge { background: #b4b4be; } .r3 .rbadge { background: #cd7f32; color: #fff; }

.rname { flex: 1; font-size: 0.88rem; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcoins { font-size: 0.95rem; font-weight: 900; color: var(--accent, #00f3ff); display: flex; align-items: center; gap: 4px; }

.bot-bar { font-size: 0.74rem; font-weight: 800; color: rgba(255, 255, 255, 0.6); display: flex; align-items: center; gap: 6px; }

.victory-modal {
  position: absolute; inset: 0; background: rgba(7, 6, 20, 0.97); backdrop-filter: blur(16px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center; z-index: 100; border-radius: 22px;
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from { opacity: 0; transform: scale(0.75); } to { opacity: 1; transform: scale(1); } }
.vic-title { font-size: 1.9rem; font-weight: 900; background: linear-gradient(135deg, var(--accent, #00f3ff), #b026ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
.vic-sub { font-size: 0.85rem; color: rgba(255,255,255,0.65); font-weight: 700; margin-bottom: 18px; }
.vic-av { width: 84px; height: 84px; border-radius: 50%; border: 3.5px solid var(--accent, #00f3ff); box-shadow: 0 0 35px var(--accent, #00f3ff); object-fit: cover; margin-bottom: 12px; }
.vic-name { font-size: 1.35rem; font-weight: 900; color: #fff; }

.err-msg { background: rgba(255,59,92,0.9); color: #fff; padding: 20px; border-radius: 14px; font-weight: 800; text-align: center; }
</style>
</head>
<body class="theme-xortex_hype">

<div class="stacked-overlay" id="ov-container">
  <div class="pill-card min" id="ov-min"><span>✅ MINIMUM</span><span id="min-val">AUCUN</span></div>
  <div class="pill-card snipe" id="ov-snipe"><span>🛡️ SNIPE DELAY</span><span class="val" id="snipe-val">10S</span></div>
  <div class="pill-card vouch" id="ov-vouch-card"><span>⭐ VOUCHES</span><span id="ov-vouch">100</span></div>

  <div class="main-box" id="ov-box">
    <div class="timer-num" id="ov-timer">01:00</div>
    <div class="sep"></div>
    <div class="ranks" id="ov-ranks"></div>
    <div class="bot-bar">👥 Total participants: <span id="ov-tot">0</span></div>

    <div class="victory-modal" id="vic-modal" style="display:none">
      <div class="vic-title" id="vic-title">🏆 WINNER!</div>
      <div class="vic-sub" id="vic-sub">Victoire de l'enchère TikTok</div>
      <div id="vic-content"></div>
    </div>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const KEY = (urlParams.get('key') || '').toUpperCase().replace(/\s+/g, '');

let es = null;
function initSSE() {
  if (es) { try { es.close(); } catch(e){} }
  es = new EventSource(`/events?key=${KEY}`);
  es.onmessage = e => {
    try { render(JSON.parse(e.data)); } catch(err){}
  };
  es.onerror = () => {
    try { es.close(); } catch(e){}
    setTimeout(initSSE, 2000);
  };
}
if (!KEY) {
  document.body.innerHTML = '<div class="err-msg">❌ Clé d\'overlay manquante dans l\'URL<br><small>?key=VOTRE_CLE</small></div>';
} else {
  initSSE();
}

function fmt(s) {
  if (!s||isNaN(s)) s=0;
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function getAvatar(p) {
  if (p.av && !p.av.includes('dicebear') && !p.av.includes('unavatar')) return p.av;
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(p.u)}&background=6b11ff&color=fff&font-size=0.55&bold=true`;
}

function render(s) {
  if (s.theme) {
    document.body.className = `theme-${s.theme}`;
  }

  const c = s.color || '#00f3ff';
  document.documentElement.style.setProperty('--accent', c);

  document.getElementById('ov-vouch').textContent = s.vouches_val || '100 VOUCHES';

  const minCard = document.getElementById('ov-min');
  if (s.min_bid_enabled) {
    document.getElementById('min-val').textContent = `${s.min_bid_val||1} 🪙`;
    minCard.style.display = 'flex';
  } else {
    document.getElementById('min-val').textContent = `AUCUN`;
  }

  const sCard = document.getElementById('ov-snipe');
  const snipeVal = document.getElementById('snipe-val');
  if (s.snipe_on) {
    snipeVal.textContent = `${Math.ceil(s.snipe_rem)}S`;
  } else {
    snipeVal.textContent = `${Math.ceil(s.snipe_dur)}S`;
  }

  const sec = s.snipe_on ? s.snipe_rem : s.timer_rem;
  const pt = document.getElementById('ov-timer');
  pt.textContent = fmt(sec);
  pt.className = 'timer-num' + (s.snipe_on?' snipe':s.timer_on&&s.timer_rem<s.snipe_dur?' warn':'');
  document.getElementById('ov-tot').textContent = s.players.length;

  const vicModal = document.getElementById('vic-modal');
  if (sec === 0 && !s.timer_on && !s.snipe_on && s.players.length > 0) {
    vicModal.style.display = 'flex';
    const top = s.players.slice(0, 2);
    if (top.length >= 2 && top[0].coins === top[1].coins && top[0].coins > 0) {
      document.getElementById('vic-title').textContent = '🤝 ÉGALITÉ / TIE!';
      document.getElementById('vic-sub').textContent = `Égalité avec ${top[0].coins} 🪙 ! Relance du Snipe...`;
      document.getElementById('vic-content').innerHTML = `
        <div style="display:flex;gap:18px;align-items:center;justify-content:center;margin-bottom:12px">
          <div><img class="vic-av" src="${getAvatar(top[0])}"><div class="vic-name">@${esc(top[0].u)}</div></div>
          <div style="font-size:1.6rem;font-weight:900;color:var(--accent)">VS</div>
          <div><img class="vic-av" src="${getAvatar(top[1])}"><div class="vic-name">@${esc(top[1].u)}</div></div>
        </div>`;
    } else if (top[0].coins > 0) {
      document.getElementById('vic-title').textContent = '🏆 WINNER!';
      document.getElementById('vic-sub').textContent = `Victoire avec ${top[0].coins} 🪙 !`;
      document.getElementById('vic-content').innerHTML = `
        <img class="vic-av" src="${getAvatar(top[0])}">
        <div class="vic-name">@${esc(top[0].u)}</div>`;
    }
  } else {
    vicModal.style.display = 'none';
  }

  const top3 = s.players.slice(0, 3);
  const medals = ['🥇', '🥈', '🥉'];
  document.getElementById('ov-ranks').innerHTML = [0,1,2].map(i => {
    const p = top3[i], cls=['r1','r2','r3'][i];
    return p ? `<div class="rrow ${cls}">
      <span class="medal">${medals[i]}</span>
      <div class="rav-wrap">
        <img class="rav" src="${getAvatar(p)}" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.u)}&background=6b11ff&color=fff'">
        <div class="rbadge">${i+1}</div>
      </div>
      <div class="rname">${esc(p.name || p.nick || p.u)}</div>
      <div class="rcoins">${p.coins} 🪙</div>
    </div>` :
    `<div class="rrow" style="opacity:.25"><span class="medal">${medals[i]}</span><div class="rav-wrap"><div class="rav"></div><div class="rbadge">${i+1}</div></div><div class="rname" style="color:#555">—</div></div>`;
  }).join('');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
