<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Auction Pro — Cosmic Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070614;
  --violet: #6b11ff;
  --indigo: #0d0b26;
  --cyan: #00f3ff;
  --neon-purple: #b026ff;
  --card-bg: rgba(13, 11, 38, 0.85);
  --border: rgba(107, 17, 255, 0.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

#canvas-bg {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; z-index: 0;
  pointer-events: none;
}

.custom-cursor {
  width: 26px; height: 26px;
  border: 2px solid var(--cyan);
  border-radius: 50%;
  position: fixed; pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%);
  transition: transform 0.04s ease;
  box-shadow: 0 0 20px var(--cyan), inset 0 0 12px var(--violet);
  mix-blend-mode: screen;
}
.custom-cursor-dot {
  width: 6px; height: 6px;
  background: #fff;
  border-radius: 50%;
  position: fixed; pointer-events: none; z-index: 10000;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 12px #fff;
}

.nebula-overlay {
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 30%, rgba(107, 17, 255, 0.18) 0%, rgba(0, 243, 255, 0.08) 45%, transparent 80%);
  z-index: 1; pointer-events: none;
}

.topbar {
  position: relative; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 45px;
  background: rgba(7, 6, 20, 0.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(107, 17, 255, 0.2);
}
.logo {
  font-size: 1.25rem; font-weight: 900; letter-spacing: 3px; text-transform: uppercase;
  background: linear-gradient(90deg, var(--cyan), var(--neon-purple), var(--violet));
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
  display: flex; align-items: center; gap: 10px;
}
@keyframes shine { to { background-position: 200% center; } }

.ping-pill {
  padding: 8px 18px;
  background: rgba(0, 243, 255, 0.08);
  border: 1px solid rgba(0, 243, 255, 0.3);
  border-radius: 30px;
  font-size: 0.8rem; font-weight: 800; color: var(--cyan);
  display: flex; align-items: center; gap: 8px;
  letter-spacing: 1px;
  box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
}
.ping-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 1.2s infinite alternate; }
@keyframes pulse { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }

.center-container {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 10; padding: 20px;
}

.tilt-card-wrapper {
  perspective: 1000px;
  width: 100%; max-width: 460px;
}

.card {
  background: var(--card-bg);
  border-radius: 32px;
  padding: 50px 42px;
  backdrop-filter: blur(35px);
  position: relative;
  box-shadow: 0 30px 100px rgba(0,0,0,0.9), 0 0 60px rgba(107, 17, 255, 0.25);
  transform-style: preserve-3d;
  transition: transform 0.2s ease-out;
  overflow: hidden;
  text-align: center;
}

.card::before {
  content: ''; position: absolute; inset: -2px; border-radius: 34px;
  padding: 2px;
  background: linear-gradient(135deg, var(--cyan), var(--neon-purple), var(--violet));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  animation: borderRotate 6s linear infinite;
  background-size: 300% 300%;
}
@keyframes borderRotate { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

.icon-glow {
  width: 84px; height: 84px; margin: 0 auto 24px auto;
  border-radius: 26px;
  background: linear-gradient(135deg, rgba(107,17,255,0.3), rgba(0,243,255,0.2));
  border: 1.5px solid rgba(0, 243, 255, 0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.6rem;
  box-shadow: 0 0 40px rgba(107, 17, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.3);
  transform: translateZ(30px);
}

.title {
  font-size: 2rem; font-weight: 900; letter-spacing: 1px;
  background: linear-gradient(135deg, #fff, var(--cyan), var(--neon-purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px; text-transform: uppercase;
  transform: translateZ(25px);
}
.sub {
  font-size: 0.85rem; color: rgba(255, 255, 255, 0.55); font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; margin-bottom: 38px;
  transform: translateZ(20px);
}

.field { text-align: left; margin-bottom: 24px; transform: translateZ(15px); }
.field label {
  font-size: 0.75rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255, 255, 255, 0.65); margin-bottom: 10px; display: block;
}

.input {
  width: 100%; padding: 18px 24px;
  background: rgba(255, 255, 255, 0.03);
  border: 1.5px solid rgba(107, 17, 255, 0.4);
  border-radius: 16px; color: #fff;
  font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; font-weight: 700;
  letter-spacing: 3px; text-align: center; outline: none;
  transition: all 0.25s ease;
}
.input:focus {
  border-color: var(--cyan);
  background: rgba(0, 243, 255, 0.08);
  box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
}
.input::placeholder { color: rgba(255, 255, 255, 0.25); font-family: 'Outfit'; font-size: 0.95rem; letter-spacing: 1px; }

.btn-galaxy {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, var(--violet), var(--neon-purple));
  border: 1.5px solid rgba(0, 243, 255, 0.4); border-radius: 16px; color: #fff;
  font-family: 'Outfit', sans-serif; font-weight: 900; font-size: 1rem;
  letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  box-shadow: 0 10px 40px rgba(107, 17, 255, 0.5);
  transition: all 0.2s ease;
  transform: translateZ(20px);
}
.btn-galaxy:hover {
  transform: translateZ(30px) translateY(-2px);
  box-shadow: 0 15px 50px rgba(176, 38, 255, 0.7), 0 0 30px var(--cyan);
  border-color: var(--cyan);
}

.err {
  margin-top: 18px; padding: 14px 20px;
  background: rgba(255, 59, 92, 0.15); border: 1px solid rgba(255, 59, 92, 0.4);
  border-radius: 14px; font-size: 0.88rem; font-weight: 800; color: #ff3b5c;
  display: none; transform: translateZ(10px);
}
.err.show { display: block; animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateZ(10px) translateX(0)} 25%{transform:translateZ(10px) translateX(-6px)} 75%{transform:translateZ(10px) translateX(6px)} }
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div class="nebula-overlay"></div>
<div class="custom-cursor" id="cursor"></div>
<div class="custom-cursor-dot" id="cursor-dot"></div>

<div class="topbar">
  <div class="logo">🎯 TikTok Auction Galaxy</div>
  <div class="ping-pill"><div class="ping-dot"></div>CLOUDFLARE 12ms</div>
</div>

<div class="center-container">
  <div class="tilt-card-wrapper" id="card-wrapper">
    <div class="card" id="card">
      <div class="icon-glow">🌌</div>
      <div class="title">Command Portal</div>
      <div class="sub">Authentification Streamer Pro</div>

      <div class="field">
        <label>🔑 Clé d'accès Streamer</label>
        <input class="input" id="key-input" type="text" placeholder="EX: KEY-AA860585" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')login()">
      </div>

      <button class="btn-galaxy" id="btn" onclick="login()">Se Connecter Au Panel →</button>
      <div class="err" id="err">❌ Clé d'accès invalide ou désactivée</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas-bg');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

const particles = [];
class Particle {
  constructor(x, y, isTrail = false) {
    this.x = x || Math.random() * width;
    this.y = y || Math.random() * height;
    this.size = isTrail ? Math.random() * 3 + 1 : Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * (isTrail ? 2.5 : 0.8);
    this.speedY = (Math.random() - 0.5) * (isTrail ? 2.5 : 0.8);
    this.color = ['#00f3ff', '#6b11ff', '#b026ff', '#ffffff'][Math.floor(Math.random()*4)];
    this.alpha = isTrail ? 1 : Math.random() * 0.7 + 0.3;
    this.life = isTrail ? 40 : 9999;
  }
  update() {
    this.x += this.speedX; this.y += this.speedY;
    if (this.life < 9999) { this.life--; this.alpha = this.life / 40; }
    else {
      if (this.x < 0 || this.x > width) this.speedX *= -1;
      if (this.y < 0 || this.y > height) this.speedY *= -1;
    }
  }
  draw() {
    ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha); ctx.fillStyle = this.color;
    ctx.shadowBlur = 12; ctx.shadowColor = this.color;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
}

for (let i = 0; i < 90; i++) particles.push(new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, width, height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update(); p.draw();
    if (p.life <= 0) particles.splice(i, 1);
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

const cursor = document.getElementById('cursor');
const cursorDot = document.getElementById('cursor-dot');
const cardWrapper = document.getElementById('card-wrapper');
const card = document.getElementById('card');

window.addEventListener('mousemove', (e) => {
  cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
  cursorDot.style.left = e.clientX + 'px'; cursorDot.style.top = e.clientY + 'px';

  for (let i = 0; i < 2; i++) {
    particles.push(new Particle(e.clientX, e.clientY, true));
  }

  const rect = cardWrapper.getBoundingClientRect();
  const cardX = rect.left + rect.width / 2;
  const cardY = rect.top + rect.height / 2;
  const rotX = Math.max(-7, Math.min(7, (e.clientY - cardY) / 35));
  const rotY = Math.max(-7, Math.min(7, -(e.clientX - cardX) / 35));
  card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
});

cardWrapper.addEventListener('mouseleave', () => {
  card.style.transform = `rotateX(0deg) rotateY(0deg)`;
});

async function login() {
  const k = document.getElementById('key-input').value.trim().toUpperCase();
  if (!k) return;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Authentification...';
  err.classList.remove('show');
  try {
    const r = await fetch('/api/key/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: k})
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('user_key', k);
      window.location.href = `/panel?key=${k}`;
    } else {
      err.textContent = '❌ ' + (d.error || 'Clé d\'accès invalide');
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Se Connecter Au Panel →';
    }
  } catch {
    err.textContent = '❌ Erreur de réponse serveur';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Se Connecter Au Panel →';
  }
}
</script>
</body>
</html>
