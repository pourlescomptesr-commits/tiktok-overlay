<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion — TikTok Auction Live</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Outfit',sans-serif;background:#07080f;color:#e8eaf6;
  min-height:100vh;display:flex;flex-direction:column;
}
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:0.12;pointer-events:none}
.orb1{width:500px;height:500px;background:#ffd700;top:-150px;left:-150px;animation:flt 12s ease infinite}
.orb2{width:400px;height:400px;background:#ff007f;bottom:-100px;right:-100px;animation:flt 9s ease infinite reverse}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-24px)}}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(7,8,15,0.8);backdrop-filter:blur(10px);position:relative;z-index:10;
}
.logo{font-size:1rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(90deg,#ff007f,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-admin{
  padding:8px 18px;background:rgba(156,33,170,0.15);border:1.5px solid rgba(156,33,170,0.4);
  border-radius:10px;color:#ce93d8;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.82rem;
  cursor:pointer;transition:all 0.2s;text-decoration:none;display:flex;align-items:center;gap:6px;
}
.btn-admin:hover{background:rgba(156,33,170,0.3);color:#fff;border-color:#9c27b0}

.center{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;z-index:1}
.card{
  width:100%;max-width:420px;background:rgba(13,14,24,0.92);
  border:1px solid rgba(255,215,0,0.12);border-radius:24px;padding:48px 40px;
  box-shadow:0 40px 100px rgba(0,0,0,0.6);backdrop-filter:blur(20px);text-align:center;
}
.icon{font-size:3rem;margin-bottom:16px;display:block}
.title{font-size:1.6rem;font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,#ffd700,#ff9900);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.sub{font-size:0.8rem;color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:36px}

.label{text-align:left;font-size:0.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:8px;display:block}
.input{
  width:100%;padding:16px 20px;background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,255,255,0.09);border-radius:12px;color:#fff;
  font-family:'Outfit',sans-serif;font-size:1rem;font-weight:700;letter-spacing:2px;
  text-align:center;outline:none;transition:border-color 0.2s;margin-bottom:14px;
}
.input:focus{border-color:#ffd700;box-shadow:0 0 0 3px rgba(255,215,0,0.08)}
.input::placeholder{color:rgba(255,255,255,0.18);letter-spacing:1px;font-weight:400;font-size:0.9rem}

.btn-submit{
  width:100%;padding:16px;background:linear-gradient(135deg,#ffd700,#ff9900);
  border:none;border-radius:12px;color:#000;font-family:'Outfit',sans-serif;font-weight:900;
  font-size:0.95rem;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 24px rgba(255,153,0,0.35);
  transition:transform 0.15s;
}
.btn-submit:hover{transform:translateY(-2px)}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none}

.err{margin-top:14px;padding:10px 16px;background:rgba(255,59,92,0.1);border:1px solid rgba(255,59,92,0.3);
  border-radius:10px;font-size:0.82rem;color:#ff3b5c;display:none}
.err.show{display:block}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="topbar">
  <div class="logo">🎯 TikTok Auction Live</div>
</div>

<div class="center">
  <div class="card">
    <span class="icon">🎟️</span>
    <div class="title">Accès au Panel</div>
    <div class="sub">Entrez votre clé d'accès</div>

    <label class="label">🔑 Clé d'accès</label>
    <input class="input" id="key-input" type="text" placeholder="EX: DEMO1234" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')login()">

    <button class="btn-submit" id="btn" onclick="login()">Accéder au Panel →</button>
    <div class="err" id="err">❌ Clé invalide ou désactivée</div>
  </div>
</div>

<script>
async function login() {
  const k = document.getElementById('key-input').value.trim().toUpperCase();
  if (!k) return;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Vérification...';
  err.classList.remove('show');
  try {
    const r = await fetch('/api/key/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: k})
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('user_key', k);
      window.location.href = `/panel?key=${k}`;
    } else {
      err.textContent = '❌ ' + (d.error || 'Clé invalide');
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Accéder au Panel →';
    }
  } catch {
    err.textContent = '❌ Erreur de serveur';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Accéder au Panel →';
  }
}
</script>
</body>
</html>
