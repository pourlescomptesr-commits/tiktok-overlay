<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion SaaS — TikTok Auction Live Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080f;
  --surface: rgba(13, 14, 24, 0.95);
  --border: rgba(255, 215, 0, 0.18);
  --gold: #ffd700;
  --pink: #ff007f;
  --purple: #9c27b0;
  --text: #e8eaf6;
  --muted: rgba(255, 255, 255, 0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.15;
  pointer-events: none;
}
.orb1 { width: 550px; height: 550px; background: var(--gold); top: -200px; left: -200px; animation: float 14s ease infinite; }
.orb2 { width: 450px; height: 450px; background: var(--pink); bottom: -150px; right: -150px; animation: float 10s ease infinite reverse; }
@keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-30px) scale(1.05); } }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 36px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  background: rgba(7, 8, 15, 0.85);
  backdrop-filter: blur(16px);
  position: relative;
  z-index: 10;
}
.logo {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: linear-gradient(90deg, var(--pink), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-pill {
  padding: 6px 14px;
  background: rgba(57, 255, 20, 0.1);
  border: 1px solid rgba(57, 255, 20, 0.3);
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 800;
  color: #39ff14;
  display: flex;
  align-items: center;
  gap: 6px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #39ff14; box-shadow: 0 0 8px #39ff14; }

.center-box {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 50px 20px;
  position: relative;
  z-index: 1;
}

.card {
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 28px;
  padding: 48px 40px;
  box-shadow: 0 50px 120px rgba(0, 0, 0, 0.7), 0 0 40px rgba(255, 215, 0, 0.05);
  backdrop-filter: blur(24px);
  text-align: center;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.card:hover {
  border-color: rgba(255, 215, 0, 0.35);
  box-shadow: 0 50px 120px rgba(0, 0, 0, 0.8), 0 0 50px rgba(255, 215, 0, 0.1);
}

.badge-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px auto;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 0, 127, 0.15));
  border: 1.5px solid rgba(255, 215, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  box-shadow: 0 10px 30px rgba(255, 215, 0, 0.15);
}

.title {
  font-size: 1.8rem;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(135deg, var(--gold), #ff9900);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.sub {
  font-size: 0.82rem;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 36px;
  font-weight: 700;
}

.field-group { text-align: left; margin-bottom: 20px; }
.label {
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  display: block;
}
.input {
  width: 100%;
  padding: 16px 20px;
  background: rgba(255, 255, 255, 0.04);
  border: 1.5px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px;
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: 2px;
  text-align: center;
  outline: none;
  transition: all 0.2s;
}
.input:focus {
  border-color: var(--gold);
  background: rgba(255, 255, 255, 0.07);
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
}
.input::placeholder { color: rgba(255, 255, 255, 0.2); letter-spacing: 1px; font-weight: 400; font-size: 0.9rem; }

.btn-submit {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--gold), #ff9900);
  border: none;
  border-radius: 14px;
  color: #000;
  font-family: 'Outfit', sans-serif;
  font-weight: 900;
  font-size: 0.95rem;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 6px 30px rgba(255, 153, 0, 0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 36px rgba(255, 153, 0, 0.5); }
.btn-submit:active { transform: none; }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.err {
  margin-top: 16px;
  padding: 12px 18px;
  background: rgba(255, 59, 92, 0.12);
  border: 1px solid rgba(255, 59, 92, 0.35);
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 800;
  color: #ff3b5c;
  display: none;
}
.err.show { display: block; }
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="topbar">
  <div class="logo">🎯 TikTok Auction Live Pro</div>
  <div class="status-pill"><div class="dot"></div>Serveur En Ligne</div>
</div>

<div class="center-box">
  <div class="card">
    <div class="badge-icon">🎟️</div>
    <div class="title">Accès au Panel</div>
    <div class="sub">Entrez votre clé d'accès Streamer</div>

    <div class="field-group">
      <label class="label">🔑 Clé d'accès unique</label>
      <input class="input" id="key-input" type="text" placeholder="EX: DEMO1234" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')login()">
    </div>

    <button class="btn-submit" id="btn" onclick="login()">Se Connecter au Panel →</button>
    <div class="err" id="err">❌ Clé invalide ou expirée</div>
  </div>
</div>

<script>
async function login() {
  const k = document.getElementById('key-input').value.trim().toUpperCase();
  if (!k) return;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Vérification en cours...';
  err.classList.remove('show');
  try {
    const r = await fetch('/api/key/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({key: k})
    });
    const d = await r.json();
    if (d.ok) {
      localStorage.setItem('user_key', k);
      window.location.href = `/panel?key=${k}`;
    } else {
      err.textContent = '❌ ' + (d.error || 'Clé invalide');
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Se Connecter au Panel →';
    }
  } catch {
    err.textContent = '❌ Erreur de connexion serveur';
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Se Connecter au Panel →';
  }
}
</script>
</body>
</html>
