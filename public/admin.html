<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin — Gestion des Clés</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#07080f;color:#e8eaf6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
:root{--border:rgba(255,255,255,0.08);--card:#0f1019;--muted:#555972;--accent:#9c27b0;--green:#00e676;--red:#ff3b5c}

#lock-screen{width:380px;text-align:center;position:relative;z-index:1}
.lock-icon{font-size:3rem;display:block;margin-bottom:16px}
.lock-title{font-size:1.4rem;font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,#ce93d8,#9c27b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.lock-sub{font-size:0.8rem;color:var(--muted);margin-bottom:28px}
.lock-input{
  width:100%;padding:15px 20px;background:rgba(255,255,255,0.04);
  border:1.5px solid var(--border);border-radius:12px;color:#fff;
  font-family:'Outfit',sans-serif;font-size:1rem;font-weight:600;
  text-align:center;letter-spacing:2px;outline:none;transition:border-color 0.2s;margin-bottom:12px;
}
.lock-input:focus{border-color:var(--accent)}
.lock-btn{
  width:100%;padding:15px;background:linear-gradient(135deg,#9c27b0,#7b1fa2);
  border:none;border-radius:12px;color:#fff;font-family:'Outfit',sans-serif;
  font-weight:800;font-size:0.92rem;letter-spacing:1px;cursor:pointer;
}
.lock-err{margin-top:12px;color:var(--red);font-size:0.82rem;display:none}

#admin-screen{width:100%;max-width:760px;padding:24px;display:none;flex-direction:column;gap:20px;position:relative;z-index:1}
.header{display:flex;align-items:center;gap:12px}
.htitle{font-size:1.2rem;font-weight:900;letter-spacing:1px;
  background:linear-gradient(135deg,#ce93d8,#9c27b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.back-link{margin-left:auto;font-size:0.8rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:#fff}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.ctitle{font-size:0.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}

.row{display:flex;gap:10px}
.create-input{
  flex:1;padding:12px 16px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:9px;color:#fff;
  font-family:'Outfit',sans-serif;font-size:0.9rem;outline:none;
}
.create-input:focus{border-color:var(--accent)}
.btn{
  padding:10px 18px;border:none;border-radius:9px;cursor:pointer;
  font-family:'Outfit',sans-serif;font-weight:700;font-size:0.82rem;transition:all 0.15s;
}
.btn-purple{background:linear-gradient(135deg,#9c27b0,#7b1fa2);color:#fff}
.btn-purple:hover{filter:brightness(1.15)}
.btn-red{background:rgba(255,59,92,0.15);border:1px solid rgba(255,59,92,0.3);color:var(--red)}
.btn-green{background:rgba(0,230,118,0.12);border:1px solid rgba(0,230,118,0.3);color:var(--green)}

.table{width:100%;border-collapse:collapse}
.table th{font-size:0.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
.table td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.85rem;vertical-align:middle}
.key-code{
  font-family:monospace;font-size:0.85rem;color:#ce93d8;letter-spacing:1.5px;
  cursor:pointer;padding:4px 8px;background:rgba(156,33,170,0.1);border-radius:6px;
  display:inline-flex;align-items:center;gap:6px;
}
.key-code:hover{background:rgba(156,33,170,0.25)}
.sbadge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:800}
.sbadge.on{background:rgba(0,230,118,0.12);color:var(--green)}
.sbadge.off{background:rgba(255,59,92,0.1);color:var(--red)}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#00e676;color:#000;padding:8px 22px;border-radius:10px;
  font-weight:800;font-size:0.85rem;display:none;z-index:999;
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- ECRAN MDP -->
<div id="lock-screen">
  <span class="lock-icon">🔐</span>
  <div class="lock-title">Administration des Clés</div>
  <div class="lock-sub">Entrez le mot de passe administrateur</div>
  <input class="lock-input" id="pw" type="password" placeholder="Mot de passe..." onkeydown="if(event.key==='Enter')unlock()">
  <button class="lock-btn" onclick="unlock()">Accéder →</button>
  <div class="lock-err" id="lock-err">❌ Mot de passe incorrect</div>
  <a class="back-link" href="/" style="display:block;margin-top:16px">← Retour à la connexion</a>
</div>

<!-- ECRAN GESTION -->
<div id="admin-screen">
  <div class="header">
    <span>🗝️</span>
    <div class="htitle">Gestion des Clés</div>
    <a class="back-link" href="/">← Retour à la connexion</a>
  </div>

  <div class="card">
    <div class="ctitle">Générer une nouvelle clé</div>
    <div class="row">
      <input class="create-input" id="new-name" type="text" placeholder="Nom de l'utilisateur (ex: Streamer Jean)" onkeydown="if(event.key==='Enter')createKey()">
      <button class="btn btn-purple" onclick="createKey()">+ Créer la clé</button>
    </div>
  </div>

  <div class="card">
    <div class="ctitle">Clés actives</div>
    <div id="keys-wrap"></div>
  </div>
</div>

<script>
let adminPw = null;

async function unlock() {
  const pw = document.getElementById('pw').value;
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pw})
    });
    const d = await r.json();
    if (d.ok) {
      adminPw = pw;
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('admin-screen').style.display = 'flex';
      loadKeys();
    } else {
      showErr();
    }
  } catch { showErr(); }
}

function showErr() {
  const e = document.getElementById('lock-err');
  e.style.display = 'block';
  setTimeout(()=>e.style.display='none', 2000);
}

async function loadKeys() {
  const r = await fetch('/api/admin/keys', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: adminPw})
  });
  const d = await r.json();
  const entries = Object.entries(d.keys || {});
  const wrap = document.getElementById('keys-wrap');
  if (!entries.length) {
    wrap.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">Aucune clé créée</div>';
    return;
  }
  wrap.innerHTML = `<table class="table">
    <thead><tr><th>Clé</th><th>Nom</th><th>Date</th><th>Statut</th><th>Actions</th></tr></thead>
    <tbody>
      ${entries.map(([k, v]) => `
        <tr>
          <td><span class="key-code" onclick="copyKey('${k}')" title="Copier la clé">${k} 📋</span></td>
          <td><b>${esc(v.name||'—')}</b></td>
          <td style="color:var(--muted);font-size:0.75rem">${v.created||'—'}</td>
          <td><span class="sbadge ${v.active?'on':'off'}">${v.active?'ACTIVE':'DÉSACTIVÉE'}</span></td>
          <td>
            <button class="btn btn-green" onclick="toggleKey('${k}')">${v.active?'Désactiver':'Activer'}</button>
            <button class="btn btn-red" onclick="deleteKey('${k}')">Supprimer</button>
          </td>
        </tr>
      `).join('')}
    </tbody>
  </table>`;
}

async function createKey() {
  const name = document.getElementById('new-name').value.trim() || 'Nouvelle Clé';
  const r = await fetch('/api/admin/keys/create', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: adminPw, name})
  });
  const d = await r.json();
  if (d.ok) {
    toast(`✅ Clé créée : ${d.key}`);
    document.getElementById('new-name').value = '';
    loadKeys();
  }
}

async function toggleKey(key) {
  await fetch('/api/admin/keys/toggle', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: adminPw, key})
  });
  loadKeys();
}

async function deleteKey(key) {
  if (!confirm(`Supprimer la clé ${key} ?`)) return;
  await fetch('/api/admin/keys/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: adminPw, key})
  });
  toast('🗑 Clé supprimée');
  loadKeys();
}

function copyKey(key) {
  navigator.clipboard.writeText(key).then(()=>toast('📋 Clé copiée !'));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 2500);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
