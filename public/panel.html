<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Panneau de Contrôle — TikTok Auction Live</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f;--surface:rgba(13,14,24,0.92);--border:rgba(255,255,255,0.08);
  --gold:#ffd700;--pink:#ff007f;--muted:rgba(255,255,255,0.38);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:#e8eaf6;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:12px 24px;
  border-bottom:1px solid var(--border);background:rgba(7,8,15,0.95);backdrop-filter:blur(10px);
}
.logo{font-size:.9rem;font-weight:900;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kbadge{padding:4px 12px;background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:20px;font-size:0.75rem;font-weight:800;color:var(--gold)}
.b{padding:7px 14px;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:800;font-size:0.78rem;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px}
.b:hover{transform:translateY(-1px)}.b:active{transform:none}
.bg{background:linear-gradient(135deg,#ffd700,#ff9900);color:#000}
.bp{background:linear-gradient(135deg,#ff007f,#9c27b0);color:#fff}
.br{background:linear-gradient(135deg,#ff3b5c,#ff007f);color:#fff}
.bb{background:linear-gradient(135deg,#00bcd4,#00e676);color:#000}
.bgr{background:rgba(255,255,255,0.06);color:#ccc;border:1px solid var(--border)}
.bgr:hover{background:rgba(255,255,255,0.12);color:#fff}

.layout{display:flex;flex:1;gap:20px;padding:20px;max-width:1400px;margin:0 auto;width:100%}
.left{width:360px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.right{flex:1;display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}
.stitle{font-size:0.7rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}

.chrono-box{text-align:center;padding:16px;background:rgba(0,0,0,0.4);border-radius:12px;border:1px solid var(--border)}
.chrono-num{font-family:'Share Tech Mono',monospace;font-size:3rem;font-weight:700;color:#39ff14;line-height:1;text-shadow:0 0 20px rgba(57,255,20,0.4)}
.chrono-num.warn{color:#ffaa00;text-shadow:0 0 20px rgba(255,170,0,0.5)}
.chrono-num.snipe{color:#ff3b5c;text-shadow:0 0 20px rgba(255,59,92,0.6);animation:blink .8s ease infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.4}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:0.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.f input,.f select{padding:9px 12px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.85rem;outline:none}
.f input:focus,.f select:focus{border-color:var(--gold)}

.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cd{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.15s}
.cd:hover{transform:scale(1.2)}.cd.on{border-color:#fff;box-shadow:0 0 8px #fff}

.preview{display:flex;align-items:center;justify-content:center;min-height:260px;background:rgba(0,0,0,0.4);border-radius:16px;border:1px dashed rgba(255,255,255,0.1);position:relative;overflow:hidden}
.ov-card{width:290px;background:rgba(7,8,15,.95);border:2.5px solid #ffd700;border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 0 30px rgba(255,215,0,.25);transition:border-color .3s,box-shadow .3s}
.ov-top{background:rgba(0,0,0,.85);border:1.5px solid #ffd700;border-radius:30px;padding:4px 16px;font-size:.78rem;font-weight:800;display:flex;align-items:center;gap:6px;letter-spacing:1px}
.ov-mid{display:flex;gap:6px;width:100%;justify-content:center}
.ov-pill{background:rgba(0,0,0,.85);border-radius:30px;padding:3px 11px;font-size:.65rem;font-weight:800;display:flex;align-items:center;gap:4px}
.ov-pill.min{border:1.5px solid #ffd700}.ov-pill.snipe{border:1.5px solid rgba(255,255,255,.15)}.ov-pill.snipe.hot{border-color:#ff3b5c}
.ov-pill .hl{color:#ffd700}.ov-pill.snipe .hl{background:rgba(255,255,255,.1);padding:1px 4px;border-radius:4px;font-size:.62rem}.ov-pill.snipe.hot .hl{background:#ff3b5c}
.ov-timer{font-family:'Share Tech Mono',monospace;font-size:2.8rem;color:#39ff14;text-shadow:0 0 14px rgba(57,255,20,.55);line-height:1}
.ov-timer.warn{color:#ffaa00}.ov-timer.snipe{color:#ff3b5c;animation:blink .8s ease infinite alternate}

.ranks{width:100%;display:flex;flex-direction:column;gap:6px}
.rrow{background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;height:42px}
.rrow.r1{border-color:rgba(255,215,0,.4)}.rrow.r2{border-color:rgba(180,180,190,.28)}.rrow.r3{border-color:rgba(205,127,50,.28)}
.rbadge{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:900;background:rgba(255,255,255,.07);color:rgba(255,255,255,.35)}
.r1 .rbadge{background:#ffd700;color:#000}.r2 .rbadge{background:#b4b4be;color:#000}.r3 .rbadge{background:#cd7f32;color:#fff}
.rav{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04)}
.rname{flex:1;font-size:.78rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcoins{font-size:.8rem;font-weight:800;display:flex;align-items:center;gap:4px}
.ddots{display:flex;gap:2px}.dd{width:5px;height:5px;border-radius:50%;background:#ffd700}
.ov-bot{background:rgba(0,0,0,.85);border:1.5px solid rgba(127,0,255,.4);border-radius:20px;padding:3px 12px;font-size:.68rem;font-weight:700}

.pp{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;flex:1}
.add-row{display:flex;gap:8px}
.add-row input[type=text]{flex:1;padding:9px 14px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:#fff;font-family:'Outfit',sans-serif;font-weight:700;font-size:0.85rem;outline:none}
.add-row input[type=text]:focus{border-color:var(--gold)}
.plist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px}
.pav{width:32px;height:32px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.05)}
.pinfo{flex:1;min-width:0}.pname{font-size:0.82rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pun{font-size:0.68rem;color:var(--muted)}
.pcoins{font-size:0.9rem;font-weight:900;color:var(--gold);margin-right:4px}
.qb{padding:4px 9px;border:none;border-radius:6px;font-family:'Outfit',sans-serif;font-weight:800;font-size:0.7rem;cursor:pointer;background:rgba(255,255,255,0.06);color:#ccc;border:1px solid var(--border);transition:all 0.15s}
.qb:hover{background:rgba(255,255,255,0.15);color:#fff}.qb.del{background:rgba(255,59,92,0.15);color:#ff3b5c;border-color:rgba(255,59,92,0.3)}
.qb.del:hover{background:#ff3b5c;color:#fff}
.ci{width:56px;padding:3px 6px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:6px;color:var(--gold);font-family:'Outfit',sans-serif;font-weight:900;font-size:0.8rem;text-align:center;outline:none}
.ci:focus{border-color:var(--gold)}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:0.8rem}
.sep{border:none;border-top:1px solid var(--border);margin:4px 0}
.toast{position:fixed;bottom:20px;right:20px;background:#00e676;color:#000;padding:10px 18px;border-radius:10px;font-weight:800;font-size:0.82rem;box-shadow:0 4px 20px rgba(0,230,118,0.4);display:none;z-index:999}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="logo">🎯 TikTok Auction Live</div>
    <div class="kbadge" id="key-badge">CLÉ: ...</div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="b bg" onclick="copyOv()">📺 Copier Overlay</button>
    <button class="b br" onclick="logout()">Déconnexion</button>
  </div>
</div>

<div class="layout">
  <div class="left">
    <div class="card">
      <div class="stitle">⏱️ Chronomètre</div>
      <div class="chrono-box">
        <div class="chrono-num" id="c-num">01:00</div>
        <div style="font-size:0.72rem;color:var(--muted);margin-top:4px" id="c-label">En attente</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="b bb" style="flex:1" onclick="timer('start')">▶ Start</button>
        <button class="b bgr" style="flex:1" onclick="timer('pause')">⏸ Pause</button>
        <button class="b br" style="flex:1" onclick="timer('reset')">↺ Reset</button>
      </div>
      <div class="grid2" style="margin-top:12px">
        <div class="f"><label>Durée (sec)</label><input id="c-dur" type="number" value="60" min="5" onchange="setTimer()"></div>
        <div class="f"><label>Snipe Delay (sec)</label><input id="c-snipe" type="number" value="10" min="0" onchange="setTimer()"></div>
      </div>
    </div>

    <div class="card">
      <div class="stitle">⭐ Récompense / Vouches</div>
      <div class="f">
        <input id="vouch-input" type="text" value="100 VOUCHES" placeholder="EX: 100 VOUCHES" onchange="updateVouchesConfig()">
      </div>
    </div>

    <div class="card">
      <div class="stitle">🎯 Minimum d'enchère</div>
      <div class="grid2">
        <div class="f">
          <label>Option</label>
          <select id="min-mode" onchange="updateMinConfig()">
            <option value="none">Pas de minimum</option>
            <option value="min">Minimum fixe</option>
          </select>
        </div>
        <div class="f" id="min-val-box" style="display:none">
          <label>Montant 🪙</label>
          <input id="min-val-input" type="number" value="10" min="1" onchange="updateMinConfig()">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="stitle">🎨 Couleur</div>
      <div class="crow">
        <div class="cd on" style="background:#ffd700" onclick="setColor('#ffd700',this)"></div>
        <div class="cd" style="background:#fff" onclick="setColor('#ffffff',this)"></div>
        <div class="cd" style="background:#ff007f" onclick="setColor('#ff007f',this)"></div>
        <div class="cd" style="background:#9c27b0" onclick="setColor('#9c27b0',this)"></div>
        <div class="cd" style="background:#00bcd4" onclick="setColor('#00bcd4',this)"></div>
        <div class="cd" style="background:#00e676" onclick="setColor('#00e676',this)"></div>
        <div class="cd" style="background:#ff3b5c" onclick="setColor('#ff3b5c',this)"></div>
        <input type="color" value="#ffd700" onchange="setColor(this.value,null)">
      </div>
    </div>

    <div class="card">
      <div class="stitle">🔴 TikTok Live</div>
      <div style="display:flex;gap:7px">
        <div class="f" style="flex:1"><input id="tt-user" type="text" placeholder="@votre_tiktok"></div>
        <button class="b br" style="flex:none;width:auto;padding:0 12px" onclick="tikConnect()">LIVE</button>
        <button class="b bgr" style="flex:none;width:36px;padding:0" onclick="tikDisconnect()" title="Stop">✕</button>
      </div>
      <p style="font-size:.65rem;color:var(--muted);margin-top:6px;line-height:1.4">Les cadeaux TikTok sont convertis automatiquement en pièces.</p>
    </div>
  </div>

  <div class="right">
    <div class="preview">
      <div class="ov-card" id="pv-card">
        <div class="ov-top" id="pv-top">⭐ <span id="pv-vouch">100 VOUCHES</span></div>
        <div class="ov-mid">
          <div class="ov-pill min" id="pv-min">✅ MIN : <span class="hl">1</span>🪙</div>
          <div class="ov-pill snipe" id="pv-snipe">🛡️ SNIPE <span class="hl">10S</span></div>
        </div>
        <div class="ov-timer" id="pv-timer">01:00</div>
        <div class="ranks" id="pv-ranks"></div>
        <div class="ov-bot">👥 Participants : <span id="pv-tot">0</span></div>
      </div>
    </div>

    <div class="pp">
      <div class="stitle" style="margin:0">👥 Joueurs — Ajouter / Gérer les pièces</div>
      <div class="add-row">
        <input id="p-u" type="text" placeholder="@pseudo_tiktok" onkeydown="if(event.key==='Enter')addP()">
        <input id="p-c" type="number" value="100" min="0" style="width:80px" placeholder="🪙">
        <button class="b bb" style="flex:none;width:auto;padding:0 13px" onclick="addP()">+ Ajouter</button>
        <button class="b br" style="flex:none;width:36px;padding:0" onclick="clearAll()" title="Tout effacer">🗑</button>
      </div>
      <div class="add-row" style="margin-top:2px;gap:5px">
        <button class="b bgr" style="font-size:0.7rem;padding:4px 8px" onclick="equalizeTop2()">⚖️ Égaliser #1 & #2</button>
        <button class="b bgr" style="font-size:0.7rem;padding:4px 8px" onclick="equalizeTop3()">⚖️ Égaliser Top 3</button>
        <button class="b bgr" style="font-size:0.7rem;padding:4px 8px" onclick="swapTop2()">🔀 Inverser #1 & #2</button>
        <button class="b br"  style="font-size:0.7rem;padding:4px 8px" onclick="resetCoins()">🧹 RAZ Pièces</button>
      </div>
      <div class="plist" id="plist"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const KEY = (urlParams.get('key') || localStorage.getItem('user_key') || '').toUpperCase().replace(/\s+/g, '');

if (!KEY) { window.location.href = '/'; }
document.getElementById('key-badge').textContent = `CLÉ: ${KEY}`;

let cfUrl = null;

let es = null;
function initSSE() {
  if (es) { try { es.close(); } catch(e){} }
  es = new EventSource(`/events?key=${KEY}`);
  es.onmessage = e => {
    try { render(JSON.parse(e.data)); } catch(err){}
  };
  es.onerror = () => {
    try { es.close(); } catch(e){}
    setTimeout(initSSE, 2000);
  };
}
initSSE();

function fmt(s) {
  if (!s||isNaN(s)) s=0;
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

let lastPlayersSig = '';

function render(s) {
  cfUrl = s.cf_url || null;
  const cn = document.getElementById('c-num'), cl = document.getElementById('c-label');
  const sec = s.snipe_on ? s.snipe_rem : s.timer_rem;
  if (cn) {
    cn.textContent = fmt(sec);
    cn.className = 'chrono-num' + (s.snipe_on?' snipe':s.timer_on&&s.timer_rem<s.snipe_dur?' warn':'');
  }
  if (cl) cl.textContent = s.snipe_on?'🚨 SNIPE DELAY !':s.timer_on?'En cours...':s.timer_rem===0?'Terminé !':'En attente';

  const c = s.color||'#ffd700';
  const card = document.getElementById('pv-card');
  if (card) { card.style.borderColor = c; card.style.boxShadow = `0 0 28px ${c}35`; }
  const pvTop = document.getElementById('pv-top');
  if (pvTop) pvTop.style.borderColor = c;
  const pvVouch = document.getElementById('pv-vouch');
  if (pvVouch) pvVouch.textContent = s.vouches_val || '100 VOUCHES';

  const minPill = document.getElementById('pv-min');
  if (minPill) {
    minPill.style.borderColor = c;
    if (s.min_bid_enabled) {
      minPill.style.display = 'flex';
      minPill.innerHTML = `✅ MIN : <span class="hl">${s.min_bid_val||1}</span>🪙`;
    } else {
      minPill.style.display = 'none';
    }
  }

  if (document.activeElement !== document.getElementById('vouch-input')) {
    const vi = document.getElementById('vouch-input');
    if (vi) vi.value = s.vouches_val || '100 VOUCHES';
  }

  if (document.activeElement !== document.getElementById('min-mode') && document.activeElement !== document.getElementById('min-val-input')) {
    const mm = document.getElementById('min-mode'), mv = document.getElementById('min-val-box'), mvi = document.getElementById('min-val-input');
    if (mm) mm.value = s.min_bid_enabled ? 'min' : 'none';
    if (mv) mv.style.display = s.min_bid_enabled ? 'block' : 'none';
    if (mvi && s.min_bid_val) mvi.value = s.min_bid_val;
  }

  const sEl = document.getElementById('pv-snipe');
  if (sEl) {
    sEl.className = 'ov-pill snipe' + (s.snipe_on?' hot':'');
    sEl.innerHTML = `🛡️ SNIPE <span class="hl">${s.snipe_on?Math.ceil(s.snipe_rem)+'S':Math.ceil(s.snipe_dur)+'S'}</span>`;
  }
  const pt = document.getElementById('pv-timer');
  if (pt) {
    pt.textContent = fmt(sec);
    pt.className = 'ov-timer' + (s.snipe_on?' snipe':s.timer_on&&s.timer_rem<s.snipe_dur?' warn':'');
  }
  const pvTot = document.getElementById('pv-tot');
  if (pvTot) pvTot.textContent = s.players.length;

  const top3 = s.players.slice(0,3);
  const pvRanks = document.getElementById('pv-ranks');
  if (pvRanks) {
    pvRanks.innerHTML = [0,1,2].map(i => {
      const p = top3[i], cls=['r1','r2','r3'][i];
      return p ? `<div class="rrow ${cls}">
        <div class="rbadge">${i+1}</div>
        <img class="rav" src="${p.av}" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(p.u)}'">
        <div class="rname">${esc(p.name || p.nick || p.u)}</div>
        <div class="rcoins">${p.coins}<div class="ddots"><div class="dd"></div><div class="dd"></div></div></div>
      </div>` :
      `<div class="rrow" style="opacity:.25"><div class="rbadge">${i+1}</div><div class="rav"></div><div class="rname" style="color:#444">—</div></div>`;
    }).join('');
  }

  const currentSig = JSON.stringify(s.players);
  if (currentSig !== lastPlayersSig) {
    lastPlayersSig = currentSig;
    const pl = document.getElementById('plist');
    if (pl) {
      if (!s.players.length) {
        pl.innerHTML = '<div class="empty">Aucun joueur pour l\'instant</div>';
      } else if (!document.activeElement || !document.activeElement.classList.contains('ci')) {
        pl.innerHTML = s.players.map((p,i) => `
          <div class="prow">
            <span style="font-size:.65rem;color:var(--muted);width:14px;text-align:center">${i+1}</span>
            <img class="pav" src="${p.av}" onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(p.u)}'">
            <div class="pinfo"><div class="pname">${esc(p.name || p.nick || p.u)}</div><div class="pun">@${esc(p.u)}</div></div>
            <span class="pcoins">${p.coins}🪙</span>
            <button class="qb" onclick="delta('${p.u}',10)">+10</button>
            <button class="qb" onclick="delta('${p.u}',100)">+100</button>
            <button class="qb" onclick="delta('${p.u}',1000)">+1k</button>
            <input class="ci" type="number" value="${p.coins}"
              onchange="setC('${p.u}',this.value)"
              onkeydown="if(event.key==='Enter'){setC('${p.u}',this.value);this.blur()}">
            <button class="qb del" onclick="removeP(${i}, '${esc(p.u)}')">✕</button>
          </div>`).join('');
      }
    }
  }
}

const api = (url, body) => fetch(url, {
  method:'POST',
  headers:{'Content-Type':'application/json'},
  body: JSON.stringify({...body, key: KEY})
});

function timer(action)   { api('/api/timer', {action}); }
function setTimer()      { api('/api/timer', {action:'set', dur:+document.getElementById('c-dur').value||60, snipe:+document.getElementById('c-snipe').value||10}); }
function setColor(c,el)  { document.querySelectorAll('.cd.on').forEach(d=>d.classList.remove('on')); if(el)el.classList.add('on'); api('/api/color',{color:c}); }
function tikConnect()    { const u=document.getElementById('tt-user').value.trim(); if(u) api('/api/tiktok',{action:'connect',user:u}); }
function tikDisconnect() { api('/api/tiktok',{action:'disconnect'}); }
function addP()          { lastPlayersSig = ''; const u=document.getElementById('p-u').value.trim(); if(!u)return; const c=parseInt(document.getElementById('p-c').value)||0; api('/api/player',{action:'add',u,coins:c}); document.getElementById('p-u').value=''; document.getElementById('p-u').focus(); }
function delta(u,v)      { lastPlayersSig = ''; api('/api/player',{action:'coins',u,mode:'delta',val:v}); }
function setC(u,v)       { lastPlayersSig = ''; api('/api/player',{action:'coins',u,mode:'set',val:parseInt(v)||0}); }
function removeP(idx,u)  { lastPlayersSig = ''; api('/api/player',{action:'remove',idx:idx,u:u}); }
function clearAll()      { lastPlayersSig = ''; api('/api/player',{action:'clear'}); }
function equalizeTop2()  { lastPlayersSig = ''; api('/api/player', {action:'equalize_top2'}); }
function equalizeTop3()  { lastPlayersSig = ''; api('/api/player', {action:'equalize_top3'}); }
function swapTop2()      { lastPlayersSig = ''; api('/api/player', {action:'swap_top2'}); }
function resetCoins()    { lastPlayersSig = ''; api('/api/player', {action:'reset_coins'}); }
function updateVouchesConfig() {
  const val = document.getElementById('vouch-input').value.trim() || '100 VOUCHES';
  api('/api/config', { vouches_val: val });
}
function updateMinConfig() {
  const mode = document.getElementById('min-mode').value;
  const val = parseInt(document.getElementById('min-val-input').value) || 1;
  document.getElementById('min-val-box').style.display = mode === 'min' ? 'block' : 'none';
  api('/api/config', {
    min_bid_enabled: mode === 'min',
    min_bid_val: val
  });
}

function copyCf() {
  if (!cfUrl) return;
  navigator.clipboard.writeText(cfUrl).then(()=>toast('✅ Lien copié !'));
}
function copyOv() {
  const base = cfUrl || window.location.origin;
  const ovLink = `${base}/overlay?key=${KEY}`;
  navigator.clipboard.writeText(ovLink).then(()=>toast('📺 Lien Overlay personnalisé copié !'));
}
function logout() {
  localStorage.removeItem('user_key');
  window.location.href = '/';
}

function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
